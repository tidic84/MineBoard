plugins { id 'dev.architectury.loom' version '1.10.453' }
group = 'fr.mineboard'
version = '0.1.0-alpha.4'
base { archivesName = 'mineboard-neoforge-1.21.1' }
def neoForgeVersion = '21.1.219'
def dedicatedDir = layout.projectDirectory.dir('run-dedicated')
def dedicatedMarker = dedicatedDir.file("libraries/net/neoforged/neoforge/${neoForgeVersion}/unix_args.txt")
repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.architectury.dev/' }
    mavenCentral()
}
configurations {
    neoForgeInstaller {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.layered {
        mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
        mappings 'dev.architectury:yarn-mappings-patch-neoforge:1.21+build.4'
    }
    neoForge "net.neoforged:neoforge:${neoForgeVersion}"
    neoForgeInstaller "net.neoforged:neoforge:${neoForgeVersion}:installer"
}

// Compile the exact same game, screen, camera, rendering and session sources on both loaders.
// Only registration / lifecycle / transport adapters differ. Never edit build/generated.
def sharedSources = tasks.register('syncSharedSources', Sync) {
    from('../fabric-1.21.1/src/main/java') {
        exclude '**/MineBoard.java', '**/FabricNetworking.java'
    }
    from('../fabric-1.21.1/src/client/java') { exclude '**/MineBoardClient.java' }
    from('../core/src/main/java')
    into layout.buildDirectory.dir('generated/shared/java')
}
sourceSets.main.java.srcDir sharedSources
sourceSets.main.resources.srcDir '../fabric-1.21.1/src/main/resources'
processResources {
    exclude 'fabric.mod.json'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
loom {
    runs {
        client { client(); programArgs '--username', 'NeoPlayerOne' }
        clientTwo { client(); runDir 'run-player-two'; programArgs '--username', 'NeoPlayerTwo' }
        smokeClient { client(); runDir 'run-smoke-client'; programArgs '--username', 'NeoSmoke', '--quickPlayMultiplayer', '127.0.0.1:25576' }
        server { server(); runDir 'run-server' }
    }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

// Architectury Loom runServer uses a merged client+server jar. RuntimeDistCleaner then
// rejects MinecraftClient while NeoForge registers packets. A standard dedicated server works.
afterEvaluate {
    tasks.named('runServer').configure {
        doFirst {
            throw new GradleException('''Architectury Loom runServer cannot start NeoForge 1.21.1 (merged jar + RuntimeDistCleaner). Use:

    .\\gradlew.bat -p neoforge-1.21.1 runDedicated
''')
        }
    }
}

tasks.register('installDedicatedServer') {
    group = 'mineboard'
    description = 'Installs a standard NeoForge dedicated server for runDedicated.'
    outputs.file dedicatedMarker
    doLast {
        dedicatedDir.asFile.mkdirs()
        if (!dedicatedMarker.asFile.exists()) {
            exec {
                workingDir dedicatedDir.asFile
                commandLine org.gradle.internal.jvm.Jvm.current().javaExecutable,
                    '-jar', configurations.neoForgeInstaller.singleFile, '--installServer'
            }
        }
        writeDedicatedDefaults(dedicatedDir)
    }
}

tasks.register('runDedicated', Exec) {
    group = 'mineboard'
    description = 'Starts a standard NeoForge dedicated server with the remapped MineBoard JAR.'
    dependsOn 'remapJar', 'installDedicatedServer'
    workingDir dedicatedDir.asFile
    standardInput = System.in
    if (org.gradle.internal.os.OperatingSystem.current().windows) {
        commandLine 'cmd.exe', '/c', 'run.bat', 'nogui'
    } else {
        commandLine './run.sh', 'nogui'
    }
    doFirst {
        writeDedicatedDefaults(dedicatedDir)
        def mods = dedicatedDir.dir('mods').asFile
        mods.mkdirs()
        mods.listFiles()?.findAll { it.name.startsWith('mineboard-') && it.name.endsWith('.jar') }?.each { it.delete() }
        copy {
            from tasks.named('remapJar').get().archiveFile
            into mods
        }
    }
}

static void writeDedicatedDefaults(dir) {
    dir.asFile.mkdirs()
    def eula = dir.file('eula.txt').asFile
    if (!eula.exists() || !eula.text.contains('eula=true')) {
        eula.text = '# Running runDedicated accepts https://aka.ms/MinecraftEULA\neula=true\n'
    }
    def properties = dir.file('server.properties').asFile
    if (!properties.exists()) {
        properties.text = 'online-mode=false\nserver-port=25576\nmotd=MineBoard dedicated\n'
    }
}
